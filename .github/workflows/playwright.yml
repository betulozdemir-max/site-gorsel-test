name: Gunluk Gorsel QA Denetimi

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub'in yeni referans resmini depoya yazmasina izin verir

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Bağımlılıkları Yükle
      run: npm ci

    - name: Playwright Tarayıcılarını Kur
      run: npx playwright install --with-deps chromium

    - name: Testi Çalıştır ve Referansı Güncelle
      run: npx playwright test anasayfa.spec.js --project=chromium --update-snapshots || true

    - name: Yeni Ekran Görüntüsünü Depoya Kaydet
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add .
        git commit -m "Linux referans gorseli otomatik olusturuldu" || exit 0
        git push

    - name: Raporu Kaydet
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

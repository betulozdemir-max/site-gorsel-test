name: Gunluk Gorsel QA Denetimi

on:
  schedule:
    # Her gun sabah 09:00'da (UTC 06:00) otomatik calisir
    - cron: '0 6 * * *'
  workflow_dispatch: # Istendiginde elle de tetiklenebilir

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Bağımlılıkları Yükle
      run: npm ci

    - name: Playwright Tarayıcılarını Kur
      run: npx playwright install --with-deps chromium

    - name: Testi Çalıştır
      run: npx playwright test tests/anasayfa.spec.js --project=chromium --update-snapshots

    - name: Raporu Kaydet (Hata Durumunda)
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
